# ===================================================================
# Adaptive Cyberattack Detection & Prevention System (Mini-SOC)
# Spring Boot Configuration
# ===================================================================

server.port=${PORT:9090}
spring.application.name=soc-java-backend

# -------------------------------------------------------------------
# Database Configuration (In-Memory H2 for local development default)
# Can be overridden via environment variables for persistent deployment.
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:socdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Web Console (Accessible at /h2-console; disabled in production via env var)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------------
# Spring Data JPA / Hibernate Settings
# -------------------------------------------------------------------
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# Jackson Serialization
# -------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.property-naming-strategy=SNAKE_CASE

# -------------------------------------------------------------------
# Python Machine Learning Microservice Connection
# -------------------------------------------------------------------
# The Java backend delegates ML inference (Isolation Forest + Random Forest)
# to the Python FastAPI backend running on port 8000 (or internal Docker host).
soc.python.ml-url=${SOC_PYTHON_ML_URL:http://localhost:8000/api/v1}

# -------------------------------------------------------------------
# CORS Configuration (Allowed Origins)
# Supports comma-separated list of origins / wildcards for frontend hosting
# -------------------------------------------------------------------
soc.cors.allowed-origins=${SOC_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000,https://*.netlify.app}

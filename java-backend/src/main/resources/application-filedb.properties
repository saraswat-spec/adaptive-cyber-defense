# ===================================================================
# Adaptive Cyberattack Detection & Prevention System (Mini-SOC)
# Optional Profile: Persistent File-Based H2 Database Storage
# Activate by running with: --spring.profiles.active=filedb
# ===================================================================

spring.datasource.url=jdbc:h2:file:./data/socdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
